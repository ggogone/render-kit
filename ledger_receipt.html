<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LEDGER Receipt</title>

<link
  rel="stylesheet"
  as="style"
  crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
>

<style>
:root{
  --paper:#f7f6f2;
  --ink:#303030;
  --muted:#737373;
  --dash:#9a9a9a;

  /* 모든 점선과 내용 사이 공통 간격 */
  --divider-gap:10px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  width:max-content;
  min-width:0;
  height:auto;

  background:transparent;

  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* ========================================
   RECEIPT
======================================== */

.receipt{
  position:relative;

  width:500px;
  min-height:0;
  height:auto;

  padding:
    58px
    28px
    34px;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(0,0,0,.015),
      transparent 24%
    ),
    radial-gradient(
      circle at 80% 35%,
      rgba(0,0,0,.012),
      transparent 28%
    ),
    var(--paper);

  box-shadow:
    0 10px 28px rgba(0,0,0,.16);

  overflow:visible;
}


/* ========================================
   RECEIPT EDGE
======================================== */

.receipt::before,
.receipt::after{
  content:"";

  position:absolute;
  left:0;

  width:100%;
  height:14px;

  background:
    linear-gradient(
      135deg,
      transparent 7px,
      var(--paper) 0
    )
    0 0 / 14px 14px repeat-x,

    linear-gradient(
      225deg,
      transparent 7px,
      var(--paper) 0
    )
    7px 0 / 14px 14px repeat-x;
}

.receipt::before{
  top:-13px;
  transform:rotate(180deg);
}

.receipt::after{
  bottom:-13px;
}


/* ========================================
   LOGO
======================================== */

.logo{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:
    8px
    0
    30px;
}

.logo img{
  display:block;

  width:390px;
  max-width:100%;
  height:auto;

  margin:0 auto;

  object-fit:contain;
}


/* ========================================
   RP DATE
======================================== */

.rp-date{
  margin:0;
  padding:0;

  text-align:center;

  font-size:18px;
  line-height:1.25;
  font-weight:500;
}


/* ========================================
   UNIVERSAL DIVIDER

   내용
   ↓ 10px
   점선
   ↓ 10px
   내용

   모든 점선은 이것만 사용
======================================== */

.rule{
  width:100%;
  height:0;

  margin:
    var(--divider-gap)
    0;

  padding:0;

  border:0;
  border-top:
    1px dashed var(--dash);
}


/* ========================================
   SECTION
======================================== */

.section{
  margin:0;
  padding:0;
}

.section-title{
  margin:
    0
    0
    6px;

  padding:0;

  font-size:17px;
  line-height:1.25;
  font-weight:800;
}


/* ========================================
   ROW LIST
======================================== */

.rows{
  width:100%;

  display:flex;
  flex-direction:column;

  margin:0;
  padding:0;

  /*
    점선 간격과 무관.
    일반 내역끼리만 촘촘하게 유지.
  */
  gap:0;
}


/* ========================================
   NORMAL ROW
======================================== */

.row{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  column-gap:16px;

  align-items:center;

  margin:0;
  padding:0;

  font-size:15.5px;
  line-height:1.35;
}


/* 일반 내역끼리만 1px */

.row + .row{
  margin-top:1px;
}


.row .label{
  min-width:0;

  margin:0;
  padding:0;

  overflow-wrap:anywhere;
}

.row .amount{
  margin:0;
  padding:0;

  text-align:right;
  white-space:nowrap;

  font-variant-numeric:
    tabular-nums;
}


/* ========================================
   SUMMARY EMPHASIS BLOCK

   이 블록 안에서도
   동일한 .rule을 사용함.

   총지출
      ↓10
   점선
      ↓10
   이번달잔액
      ↓10
   점선
      ↓10
   비상저축금차감
======================================== */

.emphasis-block{
  width:100%;

  margin:0;
  padding:0;
}


/*
  일반 .row + .row 규칙에서
  emphasis는 별도 블록이므로
  추가 행간이 발생하지 않음.
*/

.emphasis-row{
  margin:0 !important;
  padding:0;

  font-size:17px;
  line-height:1.25;
  font-weight:900;
}


/* ========================================
   STRONG ROW
======================================== */

.strong-row{
  margin:0;
  padding:0;

  font-size:17px;
  line-height:1.25;
  font-weight:900;
}


/* strong 앞 일반 행과의 기본 1px만 유지 */

.row + .strong-row{
  margin-top:1px;
}


/* ========================================
   NOTE
======================================== */

.note{
  margin:0;
  padding:0;

  font-size:15px;
  line-height:1.5;

  white-space:pre-line;
  overflow-wrap:anywhere;
}


/* ========================================
   BARCODE
======================================== */

.barcode-wrap{
  margin:0;
  padding:0;

  text-align:center;
}

.barcode{
  width:270px;
  height:58px;

  margin:
    0
    auto
    5px;

  background:
    repeating-linear-gradient(
      90deg,

      #111 0 2px,
      transparent 2px 4px,

      #111 4px 5px,
      transparent 5px 8px,

      #111 8px 11px,
      transparent 11px 13px,

      #111 13px 14px,
      transparent 14px 18px
    );
}

.barcode-number{
  margin:0;
  padding:0;

  font-family:
    "Courier New",
    monospace;

  font-size:10px;
  line-height:1.2;

  letter-spacing:5px;

  color:#575757;
}

.cheer{
  margin:
    20px
    0
    0;

  padding:0;

  text-align:center;

  font-size:14px;
  line-height:1.35;
  font-weight:500;

  color:#555;
}
</style>
</head>


<body>

<div class="receipt">


  <!-- =====================================
       LOGO
  ====================================== -->

  <div class="logo">

    <img
      src="https://ggogone.github.io/render-kit/ledger-logo.png"
      alt="LEDGER — RECORDS TODAY, A BETTER TOMORROW"
    >

  </div>


  <!-- =====================================
       RP DATE
  ====================================== -->

  <div
    class="rp-date"
    id="rpDate">
  </div>


  <div class="rule"></div>


  <!-- =====================================
       INCOME
  ====================================== -->

  <section class="section">

    <div class="section-title">
      [ 수입 ]
    </div>

    <div
      class="rows"
      id="income">
    </div>

  </section>


  <div class="rule"></div>


  <!-- =====================================
       EXPENSE
  ====================================== -->

  <section class="section">

    <div class="section-title">
      [ 지출 ]
    </div>

    <div
      class="rows"
      id="expense">
    </div>

  </section>


  <div class="rule"></div>


  <!-- =====================================
       SUMMARY
  ====================================== -->

  <section class="section">

    <div class="section-title">
      [ 정산 ]
    </div>

    <div
      class="rows"
      id="summary">
    </div>

  </section>


  <div class="rule"></div>


  <!-- =====================================
       NOTE
  ====================================== -->

  <section class="section">

    <div class="section-title">
      [ 메모 ]
    </div>

    <div
      class="note"
      id="memo">
    </div>

  </section>


  <!--
    메모 → 점선 → 바코드도
    위와 똑같은 .rule 사용
  -->

  <div class="rule"></div>


  <!-- =====================================
       BARCODE
  ====================================== -->

  <div class="barcode-wrap">

    <div class="barcode"></div>

    <div
      class="barcode-number"
      id="barcodeNumber">
    </div>

    <div
      class="cheer"
      id="cheer">
    </div>

  </div>


</div>


<script>

/* ========================================
   ESCAPE
======================================== */

function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );
}


/* ========================================
   ROW PARSER
======================================== */

function parseRow(item){

  const s =
    String(item || "")
      .trim();


  if(s.includes("^^")){

    const [
      label="",
      amount="",
      flag=""
    ] = s.split("^^");


    return {
      label,
      amount,
      flag
    };

  }


  const idx =
    s.lastIndexOf(":");


  if(idx > -1){

    return {

      label:
        s
          .slice(0,idx)
          .trim(),

      amount:
        s
          .slice(idx + 1)
          .trim(),

      flag:""

    };

  }


  return {

    label:s,

    amount:"",

    flag:""

  };

}


/* ========================================
   BASE ROW HTML
======================================== */

function baseRowHTML(
  r,
  extraClass=""
){

  return `
    <div class="row ${extraClass}">

      <div class="label">
        ${esc(r.label)}
      </div>

      <div class="amount">
        ${esc(r.amount)}
      </div>

    </div>
  `;

}


/* ========================================
   ROW HTML
======================================== */

function rowHTML(item){

  const r =
    parseRow(item);


  /*
    강조 정산은
    border/margin을 자체적으로 만들지 않고
    공통 .rule 두 개 사이에 넣음.
  */

  if(
    r.flag === "emphasis"
  ){

    return `
      <div class="emphasis-block">

        <div class="rule"></div>

        ${baseRowHTML(
          r,
          "emphasis-row"
        )}

        <div class="rule"></div>

      </div>
    `;

  }


  if(
    r.flag === "strong"
  ){

    return baseRowHTML(
      r,
      "strong-row"
    );

  }


  return baseRowHTML(r);

}


/* ========================================
   ROW LIST
======================================== */

function rowsHTML(v){

  return String(v || "")

    .split("~~")

    .filter(Boolean)

    .map(rowHTML)

    .join("");

}


/* ========================================
   HASH
======================================== */

function hashString(s){

  let h = 0;


  for(
    let i = 0;
    i < s.length;
    i++
  ){

    h =
      (
        h * 31 +
        s.charCodeAt(i)
      ) >>> 0;

  }


  return h;

}


/* ========================================
   BARCODE NUMBER
======================================== */

function makeBarcodeNumber(date){

  const digits =

    String(date || "")

      .replace(
        /[^\d]/g,
        ""
      )

      .padEnd(
        8,
        "0"
      )

      .slice(
        0,
        8
      );


  const tail =

    String(
      hashString(
        date || "ledger"
      )
    )

      .padStart(
        6,
        "0"
      )

      .slice(-6);


  return (
    digits +
    tail
  ).slice(
    0,
    14
  );

}


/* ========================================
   POSITIVE LINES
======================================== */

const CHEERS = [

  "네가 가는 길을 의심하지 마.",

  "잘하고 있어. 오늘도 충분해.",

  "천천히 가도 괜찮아.",

  "지금까지도 잘 버텨왔어.",

  "오늘의 한 걸음도 분명히 남아.",

  "조금 늦어도 방향은 맞아.",

  "네 속도로 가면 돼.",

  "오늘도 수고했어 :)"

];


function pickCheer(
  date,
  override
){

  if(
    String(
      override || ""
    ).trim()
  ){

    return override;

  }


  const h =

    hashString(
      String(
        date || "ledger"
      )
    );


  return CHEERS[
    h %
    CHEERS.length
  ];

}


/* ========================================
   DATA
======================================== */

function parseData(){

  const raw =

    new URLSearchParams(
      location.search
    )

    .get("data");


  if(!raw){

    return null;

  }


  const [

    rpDate="",

    income="",

    expense="",

    summary="",

    memo="",

    cheer=""

  ] = raw.split("||");


  return {

    rpDate,

    income,

    expense,

    summary,

    memo,

    cheer

  };

}


/* ========================================
   RENDER
======================================== */

function render(d){


  document
    .getElementById(
      "rpDate"
    )
    .textContent =
      d.rpDate || "";


  document
    .getElementById(
      "income"
    )
    .innerHTML =
      rowsHTML(
        d.income
      );


  document
    .getElementById(
      "expense"
    )
    .innerHTML =
      rowsHTML(
        d.expense
      );


  document
    .getElementById(
      "summary"
    )
    .innerHTML =
      rowsHTML(
        d.summary
      );


  document
    .getElementById(
      "memo"
    )
    .textContent =

      String(
        d.memo || ""
      )

      .replace(
        /\s*\/\/\s*/g,
        "\n"
      );


  document
    .getElementById(
      "barcodeNumber"
    )
    .textContent =

      makeBarcodeNumber(
        d.rpDate
      );


  document
    .getElementById(
      "cheer"
    )
    .textContent =

      pickCheer(
        d.rpDate,
        d.cheer
      );

}


/* ========================================
   START
======================================== */

const data =
  parseData();


render(

  data || {


    rpDate:

      "2025년 8월 / 4주차",


    income:

      "대리석 베일 카메오 (라울, 수령분)^^+1,800"

      +

      "~~대리석 레이스 코스터 (라즐로, 수령분)^^+950"

      +

      "~~베일 펜던트 커스텀 2점 (중년 부부)^^+620"

      +

      "~~소형 전시작 판매 (쇼룸, 3점)^^+1,150"

      +

      "~~갤러리 위탁 정산 (7월분)^^+2,400",


    expense:

      "식비^^-180"

      +

      "~~카페^^-34"

      +

      "~~교통·주유^^-95"

      +

      "~~정비소 (라디에이터, 오진 부품)^^-1,240"

      +

      "~~석재·소모품 (블록 2, 다이아 날, 사포)^^-1,870"

      +

      "~~생활비 (공과금·수도·전기)^^-310"

      +

      "~~기타 (보청기 건조제·이어몰드 세정, 배송)^^-88",


    summary:

      "총수입^^+6,920"

      +

      "~~총지출^^-3,817"

      +

      "~~이번달잔액^^+3,103^^emphasis"

      +

      "~~비상저축금차감 (집안 빚 상환 이체)^^-2,800"

      +

      "~~남은비상저축금^^412^^strong",


    memo:

      "라디에이터에 1,240불 넣고 결국 고무 호스는 남이 사다 줬다.",


    cheer:

      ""

  }

);

</script>

</body>
</html>
