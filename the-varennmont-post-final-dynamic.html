<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Varenmont Post</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');
  *{box-sizing:border-box}
  html,body{margin:0;background:#d7d3ca}
  body{font-family:"Source Serif 4","Noto Serif KR",Georgia,serif;color:#172033}
  .paper{width:1200px;margin:0 auto;padding:34px 40px 28px;background:#f5f1e8;box-shadow:0 14px 50px rgba(0,0,0,.18)}
  .kr{color:#8b9098;font-family:"Noto Serif KR",serif}
  .masthead{text-align:center;padding:18px 0 12px;border-top:3px solid #0d2b59;border-bottom:2px solid #0d2b59}
  .masthead h1{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:68px;line-height:.95;letter-spacing:-2.5px;font-weight:600;color:#0d2b59}
  .mast-sub{margin-top:11px;font-size:12px;letter-spacing:2.1px;font-weight:700}
  .issuebar{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:10px 0 12px;border-bottom:1px solid #0d2b59;font:700 11px/1 Arial,"Pretendard",sans-serif;letter-spacing:.35px}
  .issuebar .right{text-align:right}
  .topgrid{display:grid;grid-template-columns:minmax(0,2.08fr) minmax(0,.92fr);gap:30px;margin-top:24px}
  .section-kicker{font:800 14px/1 Arial,"Pretendard",sans-serif;color:#0d2b59;margin-bottom:15px}
  .headline{margin:0;max-width:720px;font-size:46px;line-height:1.12;letter-spacing:-2.1px;font-weight:700;color:#111}
  .headline-kr{margin:8px 0 0;font-size:21px;line-height:1.35;font-weight:600;letter-spacing:-.8px}
  .summary{margin:15px 0 18px}
  .summary .en{margin:0 0 4px;font-size:14px;line-height:1.48;color:#273142}
  .summary .kr{margin:0;font-size:12.5px;line-height:1.52}
  .article{border-top:2px solid #0d2b59;padding-top:16px;columns:2;column-gap:26px;column-rule:1px solid rgba(13,43,89,.12)}
  .article .pair{break-inside:avoid;margin:0 0 14px}
  .article .en{margin:0 0 5px;font-size:13.5px;line-height:1.5}
  .article .kr{margin:0;font-size:12px;line-height:1.54}
  .voices{border:1px solid #69778a;background:rgba(255,255,255,.14)}
  .box-title{background:#0d2b59;color:#fff;text-align:center;padding:9px 12px;font:800 16px/1 Arial,"Pretendard",sans-serif;letter-spacing:.3px}
  .voice{padding:16px 18px}.voice + .voice{border-top:1px dotted #69778a}
  .voice .name{font:800 14px/1.15 Arial,"Pretendard",sans-serif;color:#0d2b59}
  .voice .role{margin-top:4px;font:700 10px/1.2 Arial,"Pretendard",sans-serif;color:#35527a;text-transform:uppercase}
  .voice .en{margin:11px 0 4px;font-size:12.3px;line-height:1.43}
  .voice .kr{margin:0;font-size:11.2px;line-height:1.47}
  .onscene{margin-top:18px;border:1px solid #77818e;display:grid;grid-template-columns:142px 1fr 145px;align-items:center;min-height:106px}
  .onscene .label{padding:16px;font:800 14px/1.15 Arial,"Pretendard",sans-serif;color:#0d2b59}
  .onscene .label svg{width:26px;height:26px;vertical-align:middle;margin-right:8px;fill:none;stroke:currentColor;stroke-width:1.7}
  .onscene .desc{border-left:1px solid #98a0aa;border-right:1px solid #98a0aa;padding:13px 17px}
  .onscene .desc .en{margin:0 0 4px;font-size:12.2px;line-height:1.46}
  .onscene .desc .kr{margin:0;font-size:11.3px;line-height:1.5}
  .onscene .credit{padding:14px 15px;font:700 10px/1.5 Arial,"Pretendard",sans-serif}
  .bottomgrid{display:grid;grid-template-columns:.92fr 1.08fr 1.08fr;gap:22px;margin-top:22px}
  .panel{border:1px solid #788392;background:rgba(255,255,255,.10)}
  .panel-body{padding:13px 15px 15px}
  .event{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:5px 0 13px}.event + .event{border-top:1px dotted #7d8795;padding-top:14px}
  .event-date{font:800 10px/1 Arial,"Pretendard",sans-serif;color:#0d2b59}.event-date strong{display:block;font-size:27px;line-height:1;margin-top:4px}
  .event .place{font:800 9.5px/1.2 Arial,"Pretendard",sans-serif;color:#3f516d}.event .title{margin-top:5px;font-size:14px;font-weight:700}
  .event .en{margin-top:5px;font-size:10.9px;line-height:1.42}.event .kr{margin-top:3px;font-size:10.5px;line-height:1.45}
  .pulse{display:grid;grid-template-columns:38px 1fr;gap:11px;padding:10px 0 12px}.pulse + .pulse{border-top:1px dotted #7d8795}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(#b8b8b8,#777);position:relative;overflow:hidden}
  .avatar:before{content:"";position:absolute;left:11px;top:6px;width:14px;height:14px;border-radius:50%;background:#323232}
  .avatar:after{content:"";position:absolute;left:6px;bottom:0;width:24px;height:17px;border-radius:13px 13px 5px 5px;background:#323232}
  .pulse .en{font-size:11.5px;line-height:1.4;margin:0 0 3px}.pulse .kr{font-size:10.7px;line-height:1.44;margin:0}
  .pulse .meta{margin-top:5px;font:700 9.2px/1.2 Arial,"Pretendard",sans-serif;color:#576275}
  .notice{display:grid;grid-template-columns:34px 1fr;gap:11px;padding:12px 0}.notice + .notice{border-top:1px dotted #7d8795}
  .notice .icon{width:28px;height:28px;color:#0d2b59}.notice .icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .notice .en{margin:0 0 4px;font-size:11.3px;line-height:1.42}.notice .kr{margin:0;font-size:10.6px;line-height:1.46}
  .credits{margin-top:19px;padding-top:10px;border-top:1px solid #0d2b59;display:grid;grid-template-columns:1fr 1fr;font:800 10px/1.3 Arial,"Pretendard",sans-serif;letter-spacing:.2px}
  .credits div:last-child{text-align:right}.credits span{color:#555f70;font-weight:700;margin-right:8px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="icon-electric" viewBox="0 0 24 24"><path d="M13 2 5.5 13h5L9.8 22 18.5 10h-5L13 2Z"/></symbol>
  <symbol id="icon-academic" viewBox="0 0 24 24"><path d="M4 3.5h11a2 2 0 0 1 2 2V20H6a2 2 0 0 1-2-2Z"/><path d="M8 8h5M8 12h4M14.5 15.5l4-4 2 2-4 4-3 1Z"/></symbol>
  <symbol id="icon-news" viewBox="0 0 24 24"><path d="M4 5h12a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2Z"/><path d="M18 8h2v9a2 2 0 0 1-2 2"/><path d="M7 8h7M7 11h7M7 15h3M12 15h2"/></symbol>
  <symbol id="icon-location" viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="1.5"/><path d="M7 3v5M17 3v5M3.5 9.5h17M7 13h3M14 13h3M7 17h3"/></symbol>
  <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4Z"/><path d="M12 9v5"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-maintenance" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.2 5.2L4 17l3 3 5.3-5.3a4 4 0 0 0 5.2-5.2l-2.6 2.6-3-3Z"/></symbol>
  <symbol id="icon-hours" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
</svg>

<main class="paper">
  <header class="masthead">
    <h1>THE VARENMONT POST</h1>
    <div class="mast-sub">VARENMONT UNIVERSITY · THE INDEPENDENT STUDENT NEWSPAPER</div>
  </header>

  <div class="issuebar">
    <div>VOL. 84, NO. 06</div>
    <div id="date">FRIDAY · FEBRUARY 14 · 2025</div>
    <div class="right">TRUTH · COMMUNITY · CURIOSITY</div>
  </div>

  <section class="topgrid">
    <div>
      <div class="section-kicker">CAMPUS</div>
      <h2 class="headline" id="headline-en"></h2>
      <div class="headline-kr kr" id="headline-kr"></div>

      <div class="summary">
        <p class="en" id="summary-en"></p>
        <p class="kr" id="summary-kr"></p>
      </div>

      <div class="article" id="article"></div>

      <div class="onscene">
        <div class="label">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="17" height="13" rx="2"/><path d="M8 6.5 9.5 4.5h5L16 6.5"/><circle cx="12" cy="13" r="3.2"/></svg>
          ON SCENE
        </div>
        <div class="desc">
          <p class="en" id="photo-en"></p>
          <p class="kr" id="photo-kr"></p>
        </div>
        <div class="credit">PHOTO NOTE<br><span id="photo-credit"></span></div>
      </div>
    </div>

    <aside class="voices">
      <div class="box-title">VOICES</div>
      <div id="voices"></div>
    </aside>
  </section>

  <section class="bottomgrid">
    <div class="panel">
      <div class="box-title">UPCOMING</div>
      <div class="panel-body" id="events"></div>
    </div>

    <div class="panel">
      <div class="box-title">CAMPUS PULSE</div>
      <div class="panel-body" id="pulse"></div>
    </div>

    <div class="panel">
      <div class="box-title">NOTICE BOARD</div>
      <div class="panel-body" id="notices"></div>
    </div>
  </section>

  <footer class="credits">
    <div><span>PHOTOGRAPHY</span><b id="photographer"></b></div>
    <div><span>REPORTING</span><b id="reporter"></b></div>
  </footer>
</main>

<script>
const raw = new URLSearchParams(location.search).get("data") || "";

function txt(v=""){ return v.replace(/\+/g," ").trim(); }
function esc(v=""){
  return txt(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pair(v=""){
  const a=v.split("^^");
  return [a[0]||"", a.slice(1).join("^^")||""];
}
function rows(v=""){ return v ? v.split("~~").filter(Boolean) : []; }

const f = raw.split("||");

/*
0 date
1 headline EN^^KR
2 summary EN^^KR
3 photo description EN^^KR
4 main article: EN^^KR~~EN^^KR~~EN^^KR
5 key interviews: NAME^^ROLE^^EN^^KR~~x3
6 events: DATE^^PLACE^^TITLE^^EN^^KR~~x2
7 anonymous voices: META^^EN^^KR~~x3
8 notices: TYPE^^EN^^KR~~x1~3
9 photographer
10 reporter
*/

document.getElementById("date").textContent = txt(f[0] || "CURRENT ISSUE");

const [headlineEn, headlineKr] = pair(f[1]);
document.getElementById("headline-en").textContent = txt(headlineEn);
document.getElementById("headline-kr").textContent = txt(headlineKr);

const [summaryEn, summaryKr] = pair(f[2]);
document.getElementById("summary-en").textContent = txt(summaryEn);
document.getElementById("summary-kr").textContent = txt(summaryKr);

const [photoEn, photoKr] = pair(f[3]);
document.getElementById("photo-en").textContent = txt(photoEn);
document.getElementById("photo-kr").textContent = txt(photoKr);

document.getElementById("article").innerHTML = rows(f[4]).map(r=>{
  const [en,kr]=pair(r);
  return `<div class="pair"><p class="en">${esc(en)}</p><p class="kr">${esc(kr)}</p></div>`;
}).join("");

document.getElementById("voices").innerHTML = rows(f[5]).slice(0,3).map(r=>{
  const a=r.split("^^");
  return `<div class="voice">
    <div class="name">${esc(a[0]||"")}</div>
    <div class="role">${esc(a[1]||"")}</div>
    <p class="en">${esc(a[2]||"")}</p>
    <p class="kr">${esc(a.slice(3).join("^^")||"")}</p>
  </div>`;
}).join("");

function eventDate(v){
  const s=txt(v);
  const m=s.match(/^([A-Za-z가-힣.]+)\s*([0-9]{1,2})$/);
  if(m) return `${esc(m[1])}<strong>${esc(m[2])}</strong>`;
  return esc(s);
}
document.getElementById("events").innerHTML = rows(f[6]).slice(0,2).map(r=>{
  const a=r.split("^^");
  return `<div class="event">
    <div class="event-date">${eventDate(a[0]||"")}</div>
    <div>
      <div class="place">${esc(a[1]||"")}</div>
      <div class="title">${esc(a[2]||"")}</div>
      <div class="en">${esc(a[3]||"")}</div>
      <div class="kr">${esc(a.slice(4).join("^^")||"")}</div>
    </div>
  </div>`;
}).join("");

document.getElementById("pulse").innerHTML = rows(f[7]).slice(0,3).map(r=>{
  const a=r.split("^^");
  return `<div class="pulse">
    <div class="avatar"></div>
    <div>
      <p class="en">${esc(a[1]||"")}</p>
      <p class="kr">${esc(a.slice(2).join("^^")||"")}</p>
      <div class="meta">${esc(a[0]||"")}</div>
    </div>
  </div>`;
}).join("");

const aliases = {
  "전기":"electric","시설/전기":"electric","electric":"electric",
  "시험":"academic","학사":"academic","학사/시험":"academic","academic":"academic",
  "신문":"news","신문부":"news","news":"news",
  "장소":"location","장소변경":"location","location":"location",
  "일정":"calendar","calendar":"calendar",
  "주의":"warning","안전":"warning","warning":"warning",
  "보수":"maintenance","시설보수":"maintenance","maintenance":"maintenance",
  "운영시간":"hours","시간":"hours","hours":"hours"
};
document.getElementById("notices").innerHTML = rows(f[8]).slice(0,3).map(r=>{
  const a=r.split("^^");
  const type=aliases[txt(a[0]).toLowerCase()] || aliases[txt(a[0])] || "news";
  return `<div class="notice">
    <div class="icon"><svg viewBox="0 0 24 24"><use href="#icon-${type}"></use></svg></div>
    <div><p class="en">${esc(a[1]||"")}</p><p class="kr">${esc(a.slice(2).join("^^")||"")}</p></div>
  </div>`;
}).join("");

const photographer = txt(f[9] || "");
const reporter = txt(f[10] || "");
document.getElementById("photo-credit").textContent = photographer;
document.getElementById("photographer").textContent = photographer;
document.getElementById("reporter").textContent = reporter;
</script>
</body>
</html>
