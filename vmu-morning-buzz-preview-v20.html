<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE MORNING BUZZ</title>

<link rel="stylesheet" as="style" crossorigin
href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root{
  --navy:#17365f;
  --navy2:#10294a;
  --text:#1e2430;
  --muted:#728097;
  --paper:#f7f2e8;
  --line:rgba(23,54,95,.16);
  --red:#ef3d36;
  --yellow:#f4cf32;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

.scene{
  width:1080px;
  margin:0 auto;
  padding:14px 18px 24px;
  background:transparent;
}

.banner-wrap{
  position:relative;
  width:100%;
  margin:0 auto 14px;
}

.banner{
  width:100%;
  display:block;
  margin:0 auto;
}


.stack{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  position:relative;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 30px,
      rgba(23,54,95,.045) 30px,
      rgba(23,54,95,.045) 31px
    ),
    var(--paper);
  border:1px solid #e4dac9;
  border-radius:24px;
  box-shadow:0 7px 18px rgba(16,41,74,.10);
  overflow:visible;
}

.card-row{
  display:flex;
  min-height:inherit;
}

.intro,.outro{
  min-height:150px;
}

.main{
  min-height:290px;
}

.tag{
  flex:0 0 116px;
  background:linear-gradient(180deg,#183c70,#102f5d);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  padding:18px 12px 16px;
  position:relative;
}

.tag.left{border-radius:24px 0 0 24px}
.tag.right{
  order:2;
  border-radius:0 24px 24px 0;
}

.tag.left:after,
.tag.right:before{
  content:"";
  position:absolute;
  top:15px;
  bottom:15px;
  width:18px;
  background:
    radial-gradient(circle,#f1e9dc 0 4px,transparent 4.7px)
    center top/12px 27px repeat-y;
}

.tag.left:after{right:-9px}
.tag.right:before{left:-9px}

.seg{
  font-size:25px;
  line-height:1.02;
  font-weight:900;
  text-align:center;
  letter-spacing:-.03em;
}

.segicon{
  font-size:30px;
  line-height:1;
}

.body{
  flex:1;
  min-width:0;
  position:relative;
  padding:18px 24px 16px;
}

.clip-party{
  top:-40px;
  left:-28px;
  right:auto;
}

.intro-grid{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:18px;
  align-items:center;
  min-height:112px;
}

.intro-mega{
  font-size:56px;
}

.intro-title{
  margin:0 0 6px;
  color:var(--navy);
  font-size:48px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.045em;
}

.intro-greet{
  font-size:21px;
  line-height:1.35;
  font-weight:700;
  margin-bottom:5px;
}

.intro-dj{
  font-size:23px;
  line-height:1.3;
  font-weight:700;
}

.intro-dj b{color:var(--navy)}

.intro-right{
  text-align:right;
}

.onair{
  display:inline-block;
  border:3px solid var(--red);
  border-radius:10px;
  background:#fff9f7;
  color:var(--red);
  padding:8px 13px;
  font-size:25px;
  line-height:1;
  font-weight:900;
}

.airtime{
  margin-top:9px;
  font-size:20px;
  font-weight:900;
  color:var(--navy);
}
.airdate{
  margin-top:2px;
  font-size:17px;
  font-weight:800;
  color:#6d7c93;
  letter-spacing:-.02em;
}

.foot{
  margin-top:6px;
  padding-top:7px;
  border-top:2px solid var(--line);
  display:flex;
  justify-content:space-between;
  color:var(--navy);
  font-size:13px;
  font-weight:800;
  letter-spacing:.02em;
}


.main > .card-row > .body{
  padding-left:0;
  padding-right:0;
}

.split{
  position:relative;
  display:grid;
  width:100%;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  min-height:245px;
}

.split:after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-0.5px);
  top:8px;
  bottom:8px;
  width:1px;
  background:rgba(23,54,95,.18);
  opacity:1;
}

.half{
  min-width:0;
  padding:14px 22px 16px;
}

.half:first-child,
.half:last-child{
  padding-left:22px;
  padding-right:22px;
}

.topic{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  color:var(--navy);
  font-size:29px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.035em;
}

.topic .emoji{
  font-size:27px;
}

.list{
  margin:0;
  padding:0;
  list-style:none;
}

.list li{
  margin:0;
  font-size:19px;
  line-height:1.34;
  font-weight:600;
  letter-spacing:-.04em;
  list-style:none;
}
.list li + li{
  margin-top:0;
}

.radio-mark{
  position:absolute;
  top:14px;
  right:24px;
  color:var(--navy);
  font-size:13px;
  font-weight:900;
  letter-spacing:.06em;
}

.outro-grid{
  display:grid;
  grid-template-columns:1fr auto;
  gap:16px;
  align-items:start;
  min-height:110px;
}

.outro-title{
  color:var(--navy);
  font-size:36px;
  font-weight:900;
  line-height:1;
  margin-bottom:8px;
}

.outro-badge{
  border:2px solid rgba(23,54,95,.25);
  background:#fff;
  color:var(--navy);
  border-radius:12px;
  padding:11px 14px;
  min-width:128px;
  text-align:center;
  font-size:17px;
  line-height:1.05;
  font-weight:900;
}

@media(max-width:1080px){
  body,.scene{
    width:1080px;
    max-width:1080px;
  }
}
</style>
