.card::before{content:none;}

.card::after{content:none;}

.card-top{

}

.card-bottom{
  height:1017px;
  margin-top:26px;
  padding:42px 34px 32px;
  display:flex;
  flex-direction:column;
}

.eyebrow{
  position:relative;
  z-index:1;
  text-align:center;
  color:var(--rose);

}

h1{
  position:relative;
  z-index:1;
  width:100%;
  margin:16px 0 0;
  text-align:center;

  font-size:40px;

}

.meta-row{

}
.meta-label{
  color:var(--navy);

  font-weight:800;
}

  font-size:16px;
  line-height:1.58;
  color:#46413d;
}

.message-label{

  z-index:1;
  margin:20px 10px 0;

  font-size:17px;
  font-weight:800;
}

.message{
  font-family:"Source Serif 4","Noto Serif KR",Georgia,serif;

  z-index:1;
  margin:17px 20px 0;
  
  font-size:19px;
  line-height:1.6;
  color:#302c29;
}

  margin-top:9px;
  color:#777069;
  font-size:16px;
  line-height:1.5;

}

.record-flow{
  position:relative;
  z-index:1;
  margin-top:22px;
}

.record{
  margin:0 20px;
  padding:0;
}
.record + .record{
  padding-top:0;
}
.record p{
  margin:0;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
  font-size:17px;
  line-height:1.62;
  color:#403b37;
}

.rule.mid{
  margin:18px 20px;
}
.record strong{
  color:var(--navy);
  font-weight:700;
}

.footer{
  position:relative;
  z-index:1;
  margin:auto 20px 0;
  padding-top:12px;
  border-top:1px solid rgba(120,110,98,.22);
  color:#7c746d;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.12em;
}

<body>
<main class="scene">

  <section class="card card-top">
    <div class="eyebrow">LOCKER EVENT</div>
    <h1 id="name"></h1>
    <div class="rule top"><span>✦</span></div>

    <div class="meta-row">
      <div class="meta-label">시간</div>
      <div class="meta-value" id="time"></div>
    </div>

    <div class="meta-row">
      <div class="meta-label">발견 당시 상황</div>
      <div class="meta-value" id="situation"></div>
    </div>

    <div class="message-label">메시지</div>
    <div class="message">
      <span id="message-en"></span>
      <span class="kr" id="message-kr"></span>
    </div>
  </section>

  <section class="card card-bottom">
    <div class="record-flow" id="records"></div>
    <div class="footer">PRIVATE LOCKER / CURRENT TIMELINE</div>
  </section>

</main>

<script>
function txt(v=""){
  return String(v ?? "").replace(/\+/g," ").trim();
}

function esc(v=""){
  return txt(v).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function highlight(v=""){
  return esc(v).replace(/\[\[(.*?)\]\]/g,'<strong>$1</strong>');
}

const raw = new URLSearchParams(location.search).get("data") || "";

if(raw){
  const f = raw.split("||");

  document.getElementById("name").textContent = txt(f[0] || "");
  document.getElementById("time").textContent = txt(f[1] || "");
  document.getElementById("situation").textContent = txt(f[2] || "");

  const msg = String(f[3] || "").split("^^");
  document.getElementById("message-en").textContent = txt(msg[0] || "");
  document.getElementById("message-kr").textContent = txt(msg.slice(1).join("^^") || "");

  const rows = String(f[4] || "").split("~~").filter(Boolean);

  document.getElementById("records").innerHTML = rows.map((r,i)=>{
    return `
      ${i>0 ? '<div class="rule mid"><span>✦</span></div>' : ''}
      <div class="record"><p>${highlight(r)}</p></div>
    `;
  }).join("");
}
</script>
