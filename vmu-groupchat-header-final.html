<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMU Group Chat Header</title>
<style>
:root{
  --blue-top:#1c2f67;
  --blue-mid:#255da6;
  --blue-low:#5d96c9;
  --white:#f8fbff;
  --muted:rgba(248,251,255,.78);
  --green:#4adf83;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}
.wrap{
  width:900px;
  margin:0;
  position:relative;
}
.card{
  position:relative;
  width:900px;
  min-height:430px;
  padding:42px 58px 34px;
  color:var(--white);
  overflow:hidden;
  border-radius:28px 28px 0 0;
  border:none;
  background:linear-gradient(
    180deg,
    rgba(35,52,91,.99) 0%,
    rgba(55,94,137,.97) 36%,
    rgba(78,122,157,.86) 64%,
    rgba(126,163,187,.42) 82%,
    rgba(154,183,201,.10) 93%,
    rgba(154,183,201,0) 100%
  );
}
.back{
  position:absolute;
  top:34px;
  left:38px;
  font-size:42px;
  line-height:1;
  font-weight:300;
  color:rgba(255,255,255,.94);
}
.room{
  text-align:center;
  padding:18px 150px 0;
}
.room-name{
  font-family:"Arial Black","Avenir Next","Segoe UI",Pretendard,sans-serif;
  font-size:48px;
  line-height:1.12;
  font-weight:900;
  letter-spacing:-.025em;
  text-shadow:0 1px 2px rgba(0,0,0,.10);
  overflow-wrap:anywhere;
  word-break:keep-all;
  max-width:100%;
}
.room-emoji{
  display:block;
  margin-top:31px;
  font-size:68px;
  line-height:1;
}
.notice{
  width:min(680px,86%);
  margin:38px auto 0;
  padding-bottom:58px;
  text-align:center;
}
.notice-text{
  font-size:21px;
  line-height:1.65;
  font-weight:490;
  letter-spacing:-.008em;
  color:rgba(255,255,255,.95);
  overflow-wrap:anywhere;
  word-break:keep-all;
}
.quote-mark{
  display:inline-block;
  margin:0 8px;
  font-size:1.08em;
  font-weight:500;
  color:rgba(255,255,255,.82);
}
.notice-author{
  margin-top:10px;
  text-align:right;
  font-size:18px;
  line-height:1.3;
  font-style:italic;
  font-weight:650;
  letter-spacing:.01em;
  color:rgba(255,255,255,.96);
}
.stats{
  position:absolute;
  left:34px;
  top:30px;
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:18px;
  line-height:1.2;
  font-weight:580;
  color:rgba(255,255,255,.82);
}
.stat{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:22px;
}
.status-dot{
  width:16px;
  height:16px;
  border-radius:50%;
  flex:0 0 auto;
}
.member-dot{
  background:#aeb8c8;
  box-shadow:0 0 7px rgba(174,184,200,.22);
}
.online-dot{
  background:var(--green);
  box-shadow:0 0 9px rgba(74,223,131,.32);
}
@media(max-width:920px){
  .wrap,.card{width:100vw}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="room">
      <div class="room-name" id="roomName"></div>
      <span class="room-emoji" id="roomEmoji"></span>
    </div>

    <div class="notice" id="noticeBlock">
      <div class="notice-text"><span class="quote-mark">«</span><span id="noticeText"></span><span class="quote-mark">»</span></div>
      <div class="notice-author" id="noticeAuthor"></div>
    </div>

    <div class="stats">
      <div class="stat"><span class="status-dot member-dot"></span><span>Members</span><span id="members"></span></div>
      <div class="stat"><span class="status-dot online-dot"></span><span>Online</span><span id="online"></span></div>
    </div>
  </section>
</div>

<script>
function parseData(){
  const raw=new URLSearchParams(location.search).get("data");
  if(!raw)return null;
  const p=raw.split("||");
  return {
    emoji:p[0]||"",
    room:p[1]||"",
    members:p[2]||"",
    online:p[3]||"",
    notice:p[4]||"",
    author:p[5]||""
  };
}
function render(d){
  const roomName=document.getElementById("roomName");
  roomName.textContent=d.room;

  // 긴 장난성 톡방 제목도 레이아웃이 깨지지 않도록 자동 축소.
  // 짧은 제목은 기존 48px 유지, 길어질수록 단계적으로 축소.
  const titleLen=Array.from(d.room).length;
  if(titleLen <= 12){
    roomName.style.fontSize="48px";
  }else if(titleLen <= 20){
    roomName.style.fontSize="42px";
  }else{
    roomName.style.fontSize="36px";
  }

  document.getElementById("roomEmoji").textContent=d.emoji;
  document.getElementById("members").textContent=d.members;
  document.getElementById("online").textContent=d.online;
  document.getElementById("noticeText").textContent=d.notice.replace(/ /g, "\u2009");
  document.getElementById("noticeAuthor").textContent=d.author ? "— "+d.author : "";
  document.getElementById("noticeBlock").style.display=(d.notice||d.author)?"block":"none";
}
const data=parseData();
if(data){
  render(data);
}else{
  document.querySelector(".wrap").style.display="none";
}
</script>
</body>
</html>
