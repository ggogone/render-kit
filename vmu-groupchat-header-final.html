.stat{display:flex;align-items:center;gap:7px;min-height:22px}
.status-dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.member-dot{background:#aeb8c8}
.online-dot{background:#4adf83;box-shadow:0 0 8px rgba(74,223,131,.28)}
.room{text-align:center;padding:18px 150px 0}
.room-name{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  font-size:48px;line-height:1.12;font-weight:800;letter-spacing:-.025em;
  overflow-wrap:anywhere;word-break:keep-all;max-width:100%;
}
.room-emoji{display:block;margin-top:34px;font-size:68px;line-height:1}
.notice{width:min(680px,86%);margin:42px auto 0;padding-bottom:60px;text-align:center}
.notice-text{
  font-size:21px;line-height:1.62;font-weight:490;letter-spacing:-.008em;
  color:rgba(255,255,255,.96);overflow-wrap:anywhere;word-break:keep-all;
}
.quote-mark{display:inline-block;margin:0 8px;font-size:1.08em;font-weight:500;color:rgba(255,255,255,.84)}
.notice-author{
  margin-top:9px;text-align:center;font-size:18px;line-height:1.3;font-style:italic;
  font-weight:650;letter-spacing:.01em;color:rgba(255,255,255,.97);

<body>
<div class="wrap">
  <section class="card">
    <div class="content">
      <div class="stats">
        <div class="stat"><span class="status-dot member-dot"></span><span>Members</span><span id="members"></span></div>
        <div class="stat"><span class="status-dot online-dot"></span><span>Online</span><span id="online"></span></div>
      </div>

      <div class="room">
        <div class="room-name" id="roomName"></div>
        <span class="room-emoji" id="roomEmoji"></span>
      </div>

      <div class="notice" id="noticeBlock">
        <div class="notice-text"><span class="quote-mark">«</span><span id="noticeText"></span><span class="quote-mark">»</span></div>
        <div class="notice-author" id="noticeAuthor"></div>
      </div>
    </div>
  </section>
</div>

<script>
function parseData(){
  const raw=new URLSearchParams(location.search).get("data");
  if(!raw)return null;
  const p=raw.split("||");
  return {emoji:p[0]||"",room:p[1]||"",members:p[2]||"",online:p[3]||"",notice:p[4]||"",author:p[5]||""};
}
function render(d){
  const roomName=document.getElementById("roomName");
  roomName.textContent=d.room;
  const titleLen=Array.from(d.room).length;
  roomName.style.fontSize=titleLen<=12?"48px":titleLen<=20?"42px":"36px";

  document.getElementById("roomEmoji").textContent=d.emoji;
  document.getElementById("members").textContent=d.members;
  document.getElementById("online").textContent=d.online;
  document.getElementById("noticeText").textContent=d.notice.replace(/ /g,"\u2009");
  document.getElementById("noticeAuthor").textContent=d.author||"";
  document.getElementById("noticeBlock").style.display=(d.notice||d.author)?"block":"none";
}

const data=parseData();
render(data||{
  emoji:"🎧",
  room:"Resonance",
  members:"4",
  online:"3",
  notice:"목요일 12:00 온실 집결 / 96k·24bit·4ch 이상 / 실패조건 문서 3.2항 참조",
  author:"Sylvère"
});
</script>
