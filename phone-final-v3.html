<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Renderer</title>

<link rel="stylesheet" as="style" crossorigin
href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root{
  --navy:#0f1d3a;
  --navy2:#17294d;
  --line:#dfe3ea;
  --line-soft:#eceff4;
  --text:#172033;
  --muted:#7f8898;
  --soft:#f5f7fa;
  --blue:#3978ff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  background:#eef1f5;
  color:var(--text);
  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.phone{
  width:660px;
  max-width:660px;
  margin:0 auto;
  background:#fff;
  border:1px solid #cfd5df;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(10,25,55,.10);
}

/* 상단 */

.phone-title{
  background:var(--navy);
  color:#fff;
  text-align:center;
  padding:15px 20px 12px;
  font-size:26px;
  line-height:1;
  font-weight:800;
  letter-spacing:.015em;
}

.statusbar{
  background:var(--navy2);
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 18px 9px;
  font-size:15px;
  line-height:1;
  font-weight:600;
}

.status-right{
  opacity:.96;
  white-space:nowrap;
}

/* 섹션 */

.section{
  border-top:1px solid var(--line);
}

.section-title{
  height:39px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid var(--line);
  background:#fff;
}

.section-title strong{
  font-size:18px;
  line-height:1;
  font-weight:800;
  letter-spacing:.01em;
}

.section-title .kr-label{
  margin-left:6px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600;
}

.rows{
  padding:0 14px;
}

/* 일반 행 */

.row{
  display:grid;
  grid-template-columns:35px minmax(0,1fr) auto;
  column-gap:10px;
  align-items:center;
  min-height:62px;
  padding:7px 0;
  border-bottom:1px solid var(--line-soft);
}

.row:last-child{
  border-bottom:0;
}

.icon{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--soft);
  font-size:16px;
  line-height:1;
}

.content{
  min-width:0;
}

.name{
  display:flex;
  align-items:center;
  min-width:0;
  font-size:15px;
  line-height:1.15;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread-dot{
  flex:0 0 auto;
  width:7px;
  height:7px;
  margin-left:5px;
  border-radius:50%;
  background:var(--blue);
}

/* 영문 위 / 한글 아래 */

.text-pair{
  min-width:0;
  margin-top:3px;
}

.en{
  min-width:0;
  font-size:14px;
  line-height:1.22;
  font-weight:600;
  color:#283142;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.kr{
  min-width:0;
  margin-top:2px;
  font-size:13px;
  line-height:1.2;
  font-weight:600;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  align-self:start;
  padding-top:1px;
  color:var(--muted);
  font-size:11.5px;
  line-height:1.2;
  font-weight:600;
  white-space:nowrap;
}

/* Search */

.search-row{
  display:grid;
  grid-template-columns:26px minmax(0,1fr);
  column-gap:8px;
  align-items:center;
  min-height:52px;
  padding:6px 0;
  border-bottom:1px solid var(--line-soft);
}

.search-row:last-child{
  border-bottom:0;
}

.search-row .icon{
  width:22px;
  height:22px;
  background:transparent;
  border-radius:5px;
  font-size:14px;
}

.search-row .en{
  font-size:14px;
  font-weight:600;
}

.search-row .kr{
  font-size:13px;
  font-weight:600;
}

/* Notes / Schedule */

.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
}

.bottom-section{
  min-width:0;
}

.bottom-section:first-child{
  border-right:1px solid var(--line);
}

.bottom-section .section-title{
  border-bottom:1px solid var(--line);
}

.bottom-section .rows{
  padding:0 10px;
}

.mini-row{
  display:grid;
  grid-template-columns:18px minmax(0,1fr);
  column-gap:6px;
  align-items:center;
  min-height:49px;
  padding:5px 0;
  border-bottom:1px solid var(--line-soft);
}

.mini-row:last-child{
  border-bottom:0;
}

.mini-row .icon{
  width:17px;
  height:17px;
  background:transparent;
  border-radius:0;
  font-size:11px;
}

.mini-row .text-pair{
  margin-top:0;
}

.mini-row .en{
  font-size:12.5px;
  line-height:1.18;
  font-weight:600;
}

.mini-row .kr{
  margin-top:2px;
  font-size:12px;
  line-height:1.18;
  font-weight:600;
}

/* 기타 */

.empty{
  min-height:40px;
  display:flex;
  align-items:center;
  color:#a0a7b3;
  font-size:12px;
  font-weight:600;
}

.footer{
  border-top:1px solid var(--line);
  padding:6px 12px 8px;
  text-align:center;
  color:#98a0ad;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.03em;
}

@media(max-width:660px){
  body{
    width:660px;
  }

  .phone{
    width:660px;
    max-width:660px;
  }
}
</style>
</head>

<body>

<div class="phone">

  <div class="phone-title" id="phoneTitle">
    NAME'S PHONE
  </div>

  <div class="statusbar">
    <span id="rpTime">--:--</span>
    <span class="status-right" id="battery">
      ▮▮▮▮ 5G&nbsp;&nbsp;--%
    </span>
  </div>

  <section class="section">
    <div class="section-title">
      <strong>🔔 NOTIFICATIONS</strong>
      <span class="kr-label">알림</span>
    </div>
    <div class="rows" id="notifications"></div>
  </section>

  <section class="section">
    <div class="section-title">
      <strong>💬 MESSAGES</strong>
      <span class="kr-label">메시지</span>
    </div>
    <div class="rows" id="messages"></div>
  </section>

  <section class="section">
    <div class="section-title">
      <strong>📞 RECENT CALLS</strong>
      <span class="kr-label">최근 통화</span>
    </div>
    <div class="rows" id="calls"></div>
  </section>

  <section class="section">
    <div class="section-title">
      <strong>🔎 SEARCH</strong>
      <span class="kr-label">최근 검색어</span>
    </div>
    <div class="rows" id="searches"></div>
  </section>

  <div class="bottom-grid">

    <section class="bottom-section">
      <div class="section-title">
        <strong>📋 NOTES</strong>
        <span class="kr-label">메모</span>
      </div>
      <div class="rows" id="notes"></div>
    </section>

    <section class="bottom-section">
      <div class="section-title">
        <strong>📅 SCHEDULE</strong>
        <span class="kr-label">일정</span>
      </div>
      <div class="rows" id="schedule"></div>
    </section>

  </div>

  <div class="footer">
    🔒 PERSONAL DEVICE
  </div>

</div>

<script>

function esc(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );
}

function items(section){
  if(!section) return [];
  return section.split("~~").filter(Boolean);
}

function fields(item){
  return String(item || "").split("::");
}

function englishNameOnly(value){

  const original = String(value || "").trim();

  if(!original) return "NAME";

  const english = original
    .replace(/[^A-Za-z' -]+/g," ")
    .replace(/\s+/g," ")
    .trim();

  return english || original;
}

function parseData(){

  const raw =
    new URLSearchParams(window.location.search)
      .get("data");

  if(!raw) return {};

  const parts = raw.split("||");

  const [
    name="",
    rpTime="",
    battery="",
    notificationSection="",
    messageSection="",
    callSection="",
    searchSection="",
    noteSection="",
    scheduleSection=""
  ] = parts;

  const notificationIcons = {
    msg:"💬",
    sns:"📸",
    calendar:"📅",
    school:"🎓",
    sport:"🏊",
    mail:"✉️",
    news:"📰",
    delivery:"📦",
    bank:"💳",
    system:"⚙️"
  };

  const notifications =
    items(notificationSection)
      .slice(0,4)
      .map(item => {

        const [
          type="",
          who="",
          en="",
          kr="",
          time="",
          unread="0"
        ] = fields(item);

        return {
          icon:notificationIcons[type] || "🔔",
          name:who,
          en,
          kr,
          time,
          unread:unread==="1"
        };
      });

  const messages =
    items(messageSection)
      .slice(0,4)
      .map(item => {

        const [
          who="",
          en="",
          kr="",
          time="",
          unread="0"
        ] = fields(item);

        return {
          icon:"💬",
          name:who,
          en,
          kr,
          time,
          unread:unread==="1"
        };
      });

  const calls =
    items(callSection)
      .slice(0,4)
      .map(item => {

        const [
          who="",
          en="",
          kr="",
          time="",
          direction=""
        ] = fields(item);

        let icon="📞";

        if(direction==="out") icon="↗";
        else if(direction==="in") icon="↙";
        else if(direction==="miss") icon="✕";

        return {
          icon,
          name:who,
          en,
          kr,
          time,
          unread:false
        };
      });

  const searches =
    items(searchSection)
      .slice(0,4)
      .map(item => {

        const [en="",kr=""] = fields(item);

        return {
          icon:"🔎",
          en,
          kr
        };
      });

  const notes =
    items(noteSection)
      .slice(0,4)
      .map(item => {

        const [en="",kr=""] = fields(item);

        return {
          icon:"▪",
          en,
          kr
        };
      });

  const schedule =
    items(scheduleSection)
      .slice(0,4)
      .map(item => {

        const [en="",kr=""] = fields(item);

        return {
          icon:"▪",
          en,
          kr
        };
      });

  return {
    name,
    rpTime,
    battery,
    notifications,
    messages,
    calls,
    searches,
    notes,
    schedule
  };
}

function pairHTML(en,kr){

  en=String(en || "").trim();
  kr=String(kr || "").trim();

  if(!en && !kr) return "";

  return `
    <div class="text-pair">
      ${
        en
        ? `<div class="en" title="${esc(en)}">${esc(en)}</div>`
        : ""
      }
      ${
        kr
        ? `<div class="kr" title="${esc(kr)}">${esc(kr)}</div>`
        : ""
      }
    </div>
  `;
}

function normalRowHTML(row){

  return `
    <div class="row">

      <div class="icon">
        ${esc(row.icon || "")}
      </div>

      <div class="content">

        ${
          row.name
          ?
          `<div class="name">
            <span style="
              min-width:0;
              overflow:hidden;
              text-overflow:ellipsis;
              white-space:nowrap;
            ">
              ${esc(row.name)}
            </span>
            ${
              row.unread
              ? `<span class="unread-dot"></span>`
              : ""
            }
          </div>`
          :
          ""
        }

        ${pairHTML(row.en,row.kr)}

      </div>

      ${
        row.time
        ? `<div class="time">${esc(row.time)}</div>`
        : ""
      }

    </div>
  `;
}

function searchRowHTML(row){

  return `
    <div class="search-row">

      <div class="icon">
        ${esc(row.icon || "🔎")}
      </div>

      <div class="content">
        ${pairHTML(row.en,row.kr)}
      </div>

    </div>
  `;
}

function miniRowHTML(row){

  return `
    <div class="mini-row">

      <div class="icon">
        ${esc(row.icon || "▪")}
      </div>

      <div class="content">
        ${pairHTML(row.en,row.kr)}
      </div>

    </div>
  `;
}

function renderNormal(id,rows){

  const el=document.getElementById(id);

  if(!Array.isArray(rows) || !rows.length){
    el.innerHTML=`<div class="empty">No data</div>`;
    return;
  }

  el.innerHTML =
    rows
      .slice(0,4)
      .map(normalRowHTML)
      .join("");
}

function renderSearch(id,rows){

  const el=document.getElementById(id);

  if(!Array.isArray(rows) || !rows.length){
    el.innerHTML=`<div class="empty">No data</div>`;
    return;
  }

  el.innerHTML =
    rows
      .slice(0,4)
      .map(searchRowHTML)
      .join("");
}

function renderMini(id,rows){

  const el=document.getElementById(id);

  if(!Array.isArray(rows) || !rows.length){
    el.innerHTML=`<div class="empty">No data</div>`;
    return;
  }

  el.innerHTML =
    rows
      .slice(0,4)
      .map(miniRowHTML)
      .join("");
}

const data=parseData();

const displayName=
  englishNameOnly(data.name);

document.getElementById("phoneTitle").textContent =
  displayName.toUpperCase() + "'S PHONE";

document.getElementById("rpTime").textContent =
  data.rpTime || "--:--";

document.getElementById("battery").textContent =
  "▮▮▮▮ 5G  " + (data.battery || "--%");

renderNormal("notifications",data.notifications);
renderNormal("messages",data.messages);
renderNormal("calls",data.calls);
renderSearch("searches",data.searches);
renderMini("notes",data.notes);
renderMini("schedule",data.schedule);

</script>

</body>
</html>
