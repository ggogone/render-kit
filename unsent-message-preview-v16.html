<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsent Message Preview v17</title>

<link rel="stylesheet" as="style" crossorigin
href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root{
  --ios-blue:#0a84ff;
  --incoming:#e9e9eb;
  --text:#111111;
  --muted:#8e8e93;
  --divider:#ececef;
  --keyboard:#d1d4d9;
  --key:#ffffff;
  --key-special:#aeb4bd;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
  background:#000;
  color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.phone{
  width:430px;
  height:1150px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;

  background:#fff;
  border:7px solid #151515;
  border-radius:48px;

  box-shadow:
    0 0 0 2px #4d4d4d,
    0 16px 45px rgba(0,0,0,.42);
}

/* =========================
   STATUS BAR
========================= */

.statusbar{
  flex:0 0 58px;
  position:relative;
  z-index:10;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  padding:14px 23px 0;
  background:#fff;

  font-size:15px;
  font-weight:700;
}

.status-left,
.status-right{
  height:20px;
  display:flex;
  align-items:center;
}

.status-left{
  min-width:74px;
}

.status-right{
  min-width:95px;
  justify-content:flex-end;
  gap:7px;
}

.status-time{
  line-height:1;
}

.status-center{
  position:absolute;
  left:50%;
  top:9px;
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:7px;
}

.dynamic-island{
  width:126px;
  height:36px;
  position:relative;
  border-radius:22px;
  background:#000;
}

.dynamic-island::after{
  content:"";
  position:absolute;
  right:15px;
  top:13px;

  width:8px;
  height:8px;
  border-radius:50%;

  background:
    radial-gradient(circle at 40% 40%,#17304d 0 13%,#0d1b2d 25%,#05070a 60%);
}

.owner-island{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:#000;
  color:#fff;

  font-size:11px;
  line-height:1;
  font-weight:700;
  letter-spacing:.03em;

  text-align:center;
}

.status-svg{
  display:block;
  overflow:visible;
}

.network-label{
  font-size:14px;
  line-height:1;
  font-weight:700;
  letter-spacing:-.02em;
  color:#111;
}

/* =========================
   CONTACT HEADER
========================= */

.chat-header{
  flex:0 0 86px;
  position:relative;
  background:#fff;
  border-bottom:1px solid var(--divider);
}

.back-btn{
  position:absolute;
  left:20px;
  top:28px;

  width:29px;
  height:29px;
  display:grid;
  place-items:center;
}

.contact{
  position:absolute;
  left:50%;
  top:7px;
  transform:translateX(-50%);

  width:150px;
  text-align:center;
}

.contact-avatar{
  width:43px;
  height:43px;
  margin:0 auto 4px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:linear-gradient(145deg,#dfe3e9,#a9b1bd);
  color:#fff;

  font-size:15px;
  font-weight:700;
}

.contact-name{
  display:inline-flex;
  align-items:center;
  gap:3px;

  font-size:13px;
  line-height:1;
  font-weight:600;
}

.facetime-btn{
  position:absolute;
  right:19px;
  top:28px;

  width:31px;
  height:25px;
  display:grid;
  place-items:center;
}

/* =========================
   CHAT AREA
========================= */

.chat{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;

  padding:11px 16px 8px;
  background:#fff;
}

.thread-date{
  margin:1px 0 11px;
  text-align:center;

  color:#9a9aa0;
  font-size:9.5px;
  line-height:1.2;
  font-weight:600;
}

.thread-date.compact{
  margin:9px 0 9px;
}

.message{
  width:100%;
  display:flex;
  flex-direction:column;
  margin-bottom:10px;
}

.message.in{align-items:flex-start}
.message.out{align-items:flex-end}

.bubble{
  position:relative;
  max-width:81%;

  padding:10px 13px 9px;
  border-radius:19px;
}

.message.in .bubble{
  color:#111;
  background:var(--incoming);
  border-bottom-left-radius:6px;
}

.message.out .bubble{
  color:#fff;
  background:var(--ios-blue);
  border-bottom-right-radius:6px;
}

.bubble-en{
  position:relative;
  z-index:1;

  font-size:17px;
  line-height:1.25;
  font-weight:500;

  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.bubble-kr{
  position:relative;
  z-index:1;

  margin-top:4px;

  font-size:10.5px;
  line-height:1.22;
  font-weight:500;

  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.in .bubble-kr{color:#7b7b81}
.message.out .bubble-kr{color:rgba(255,255,255,.74)}

.receipt{
  margin-top:3px;
  padding:0 5px;

  color:#99999f;
  font-size:8.7px;
  line-height:1.1;
  font-weight:500;
}

/* =========================
   COMPOSER
   Expands upward for 1~3 lines.
   Chat area shrinks via flex.
========================= */

.composer-area{
  flex:0 0 auto;
  background:#fff;
  padding:5px 10px 6px;
}

.composer-row{
  display:grid;
  grid-template-columns:35px minmax(0,1fr);
  gap:7px;
  align-items:end;
}

.plus-btn{
  width:32px;
  height:32px;

  display:grid;
  place-items:center;

  margin-bottom:1px;

  border-radius:50%;
  background:#ededf0;
  color:#737379;

  font-size:0;
  line-height:0;
  font-weight:300;

  align-items:center;
  justify-content:center;
  padding:0;
  line-height:0;
}

.compose-box{
  position:relative;

  min-height:38px;
  max-height:76px;

  display:flex;
  align-items:flex-start;

  padding:8px 40px 8px 12px;

  border:1px solid #d0d0d5;
  border-radius:20px;
  background:#fff;
}

.draft-en{
  width:100%;
  min-width:0;
  max-height:52px;
  overflow:hidden;

  color:#151515;
  font-size:14px;
  line-height:1.22;
  font-weight:500;

  white-space:normal;
  overflow-wrap:anywhere;
}

.cursor{
  display:inline-block;

  width:1.5px;
  height:15px;
  margin-left:1px;

  vertical-align:-2px;
  background:var(--ios-blue);
}

.send-btn{
  position:absolute;
  right:4px;
  bottom:4px;

  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:var(--ios-blue);
}

/* =========================
   TRANSLATION / KEYBOARD
========================= */

.keyboard{
  flex:0 0 284px;
  position:relative;

  padding:0 5px 10px;

  background:var(--keyboard);
}

.translation-bar{
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 18px;

  color:#56595f;
  text-align:center;

  font-size:10.5px;
  line-height:1.15;
  font-weight:500;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.key-row{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:6px;
}

.key{
  width:37px;
  height:40px;

  display:grid;
  place-items:center;

  border-radius:5px;
  background:var(--key);

  color:#111;
  font-size:18px;
  font-weight:500;

  box-shadow:0 1px 0 rgba(0,0,0,.28);
}

.row-2{padding:0 17px}

.row-3 .key:first-child,
.row-3 .key:last-child{
  width:48px;
  background:var(--key-special);
}

.bottom-keys{
  display:grid;
  grid-template-columns:72px 1fr 88px;
  gap:6px;
}

.bottom-key{
  height:40px;

  display:grid;
  place-items:center;

  border-radius:5px;
  background:var(--key-special);

  font-size:13px;
  font-weight:500;
}

.bottom-key.space{
  background:#fff;
}

.keyboard-footer{
  height:54px;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  padding:10px 18px 0;

  color:#676a70;
}

.home-indicator{
  position:absolute;
  left:50%;
  bottom:5px;
  transform:translateX(-50%);

  width:135px;
  height:5px;

  border-radius:5px;
  background:#111;
}

.plus-btn .plus-icon{
  display:block;
  width:20px;
  height:20px;
  margin:0;
  transform:none;
}


/* v15 final optical alignment */
.owner-island span{
  display:block;
  line-height:1;
  transform:translateY(-0.25px);
}

.plus-btn{
  display:grid !important;
  place-items:center !important;
  padding:0 !important;
  line-height:0 !important;
}

.plus-btn .plus-icon{
  display:block;
  width:20px;
  height:20px;
  margin:0;
  transform:none;
}

.send-btn{
  display:grid;
  place-items:center;
  padding:0;
  line-height:0;
}

.send-icon{
  display:block;
  transform:translateY(-0.35px);
}

.back-btn{
  display:grid;
  place-items:center;
  padding:0;
}

.back-icon{
  display:block;
  transform:translateX(0.8px);
}

.facetime-btn{
  display:grid;
  place-items:center;
  padding:0;
}

.facetime-icon{
  display:block;
  transform:translateX(-0.8px);
}

.contact{
  left:50%;
  transform:translateX(-50%);
}

</style>
</head>

<body>

<div class="phone">

  <!-- STATUS -->
  <div class="statusbar">

    <div class="status-left">
      <span class="status-time" id="statusTime">--:--</span>
    </div>

    <div class="status-center">
      <div class="dynamic-island"></div>
      <div class="owner-island"><span id="ownerInitials">--</span></div>
    </div>

    <div class="status-right">

      <!-- Cellular -->
      <svg class="status-svg" width="20" height="14" viewBox="0 0 20 14" aria-hidden="true">
        <rect x="1" y="9.2" width="3" height="3.8" rx="1.4" fill="#111"/>
        <rect x="6" y="6.2" width="3" height="6.8" rx="1.4" fill="#111"/>
        <rect x="11" y="3.1" width="3" height="9.9" rx="1.4" fill="#111"/>
        <rect x="16" y=".2" width="3" height="12.8" rx="1.4" fill="#111"/>
      </svg>

      <span class="network-label">5G</span>

      <!-- Battery -->
      <svg class="status-svg" width="28" height="14" viewBox="0 0 28 14" aria-hidden="true">
        <rect x=".8" y="1" width="23.2" height="12" rx="3.25" fill="none" stroke="#111" stroke-width="1.5"/>
        <path d="M25.2 4.35c1.15.2 1.8.83 1.8 2v1.3c0 1.17-.65 1.8-1.8 2V4.35Z" fill="#111"/>
        <rect id="batteryFill" x="3" y="3.1" width="16.8" height="7.8" rx="1.45" fill="#111"/>
      </svg>

    </div>
  </div>

  <!-- HEADER -->
  <div class="chat-header">

    <div class="back-btn">
      <svg class="back-icon" width="14" height="26" viewBox="0 0 14 26" aria-hidden="true">
        <path d="M12 2 2 13l10 11"
          fill="none" stroke="#0a84ff" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="contact">
      <div class="contact-avatar" id="contactAvatar">?</div>

      <div class="contact-name">
        <span id="contactName">Contact</span>
        <svg width="5" height="9" viewBox="0 0 5 9" aria-hidden="true">
          <path d="m1 1 3 3.5L1 8" fill="none" stroke="#b5b5ba" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="facetime-btn">
      <svg class="facetime-icon" width="30" height="22" viewBox="0 0 30 22" aria-hidden="true">
        <rect x="1.6" y="3.1" width="18.8" height="15.8" rx="4.1"
          fill="none" stroke="#0a84ff" stroke-width="2"/>
        <path d="M21.4 8.25 27.6 5.2v11.6l-6.2-3.05Z" fill="#0a84ff"/>
      </svg>
    </div>

  </div>

  <!-- THREAD -->
  <main class="chat" id="thread"></main>

  <!-- COMPOSER -->
  <div class="composer-area">

    <div class="composer-row">

      <div class="plus-btn" aria-hidden="true">
        <svg class="plus-icon" viewBox="0 0 24 24">
          <path d="M12 6V18M6 12H18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="compose-box">

        <div class="draft-en" id="draftEn"><span class="cursor"></span></div>

        <div class="send-btn">
          <svg class="send-icon" width="15" height="18" viewBox="0 0 15 18" aria-hidden="true">
            <path d="M7.5 15.8V3.1M2.7 7.8 7.5 3l4.8 4.8"
              fill="none" stroke="#fff" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

      </div>

    </div>
  </div>

  <!-- KEYBOARD -->
  <div class="keyboard">

    <div class="translation-bar" id="draftKr"></div>

    <div class="key-row">
      <div class="key">Q</div><div class="key">W</div><div class="key">E</div><div class="key">R</div><div class="key">T</div><div class="key">Y</div><div class="key">U</div><div class="key">I</div><div class="key">O</div><div class="key">P</div>
    </div>

    <div class="key-row row-2">
      <div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div><div class="key">G</div><div class="key">H</div><div class="key">J</div><div class="key">K</div><div class="key">L</div>
    </div>

    <div class="key-row row-3">

      <div class="key">
        <svg width="19" height="20" viewBox="0 0 19 20" aria-hidden="true">
          <path d="M9.5 2 2 10h4v6h7v-6h4L9.5 2Z" fill="none" stroke="#151515" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="key">Z</div><div class="key">X</div><div class="key">C</div><div class="key">V</div><div class="key">B</div><div class="key">N</div><div class="key">M</div>

      <div class="key">
        <svg width="23" height="18" viewBox="0 0 23 18" aria-hidden="true">
          <path d="M8 2h12v14H8L2 9l6-7Z" fill="none" stroke="#151515" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m11 6 5 6m0-6-5 6" stroke="#151515" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>

    </div>

    <div class="bottom-keys">
      <div class="bottom-key">123</div>
      <div class="bottom-key space">space</div>
      <div class="bottom-key">return</div>
    </div>

    <div class="keyboard-footer">

      <!-- Emoji -->
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="#676a70" stroke-width="1.7"/>
        <circle cx="8.8" cy="9.2" r="1" fill="#676a70"/>
        <circle cx="15.2" cy="9.2" r="1" fill="#676a70"/>
        <path d="M7.8 14.1c1.2 2 2.7 3 4.2 3s3-1 4.2-3" fill="none" stroke="#676a70" stroke-width="1.6" stroke-linecap="round"/>
      </svg>

      <!-- Microphone -->
      <svg width="22" height="30" viewBox="0 0 24 32" aria-hidden="true">
        <rect x="8" y="2" width="8" height="17" rx="4" fill="none" stroke="#676a70" stroke-width="2"/>
        <path d="M5 15.5V17c0 4 3.1 7 7 7s7-3 7-7v-1.5" fill="none" stroke="#676a70" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 24v5M8.5 29h7" fill="none" stroke="#676a70" stroke-width="2" stroke-linecap="round"/>
      </svg>

    </div>

    <div class="home-indicator"></div>
  </div>

</div>


<script>
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function initials(name){
  const s=String(name||"").trim();
  if(!s)return "?";
  const words=s.split(/\s+/).filter(Boolean);
  return words.map(w=>w[0]||"").join("").slice(0,2).toUpperCase();
}

function parseBattery(value){
  const n=parseInt(String(value||"").replace(/[^\d]/g,""),10);
  return Number.isFinite(n) ? Math.max(0,Math.min(100,n)) : 75;
}

function parseData(){
  const raw=new URLSearchParams(location.search).get("data");
  if(!raw)return null;

  const parts=raw.split("||");
  const owner=parts[0]||"--";
  const time=parts[1]||"--:--";
  const battery=parts[2]||"75";
  const contact=parts[3]||"Contact";

  const tail=parts.slice(4).filter(v=>v!=="");
  let messageItems=[];
  let draftEn="";
  let draftKr="";

  // Old format: one message field containing ~~ separated messages.
  if(tail[0] && tail[0].includes("~~")){
    messageItems=tail[0].split("~~").filter(Boolean);
    draftEn=tail[1]||"";
    draftKr=tail[2]||"";
  }else{
    // Current format: every message is its own || field.
    // A valid message has ^^in^^ or ^^out^^ in the second slot.
    const leftovers=[];
    tail.forEach(item=>{
      const f=String(item).split("^^");
      const dir=(f[1]||"").toLowerCase();
      if(dir==="in" || dir==="out"){
        messageItems.push(item);
      }else{
        leftovers.push(item);
      }
    });
    draftEn=leftovers[0]||"";
    draftKr=leftovers[1]||"";
  }

  const messages=messageItems.map(item=>{
    const f=String(item).split("^^");
    return {
      date:f[0]||"",
      direction:(f[1]||"in").toLowerCase(),
      en:f[2]||"",
      kr:f[3]||"",
      state:f[4]||""
    };
  }).slice(-8);

  return {owner,time,battery,contact,messages,draftEn,draftKr};
}

function messageHTML(m){
  const dir=m.direction==="out" ? "out" : "in";
  const date=m.date ? `<div class="thread-date compact">${esc(m.date)}</div>` : "";
  const state=(dir==="out" && m.state) ? `<div class="receipt">${esc(m.state)}</div>` : "";
  return `${date}
    <div class="message ${dir}">
      <div class="bubble">
        <div class="bubble-en">${esc(m.en)}</div>
        ${m.kr ? `<div class="bubble-kr">${esc(m.kr)}</div>` : ""}
      </div>
      ${state}
    </div>`;
}

function render(data){
  document.getElementById("ownerInitials").textContent=String(data.owner||"--").slice(0,3).toUpperCase();
  document.getElementById("statusTime").textContent=data.time||"--:--";
  document.getElementById("contactName").textContent=data.contact||"Contact";
  document.getElementById("contactAvatar").textContent=initials(data.contact).slice(0,1);

  const pct=parseBattery(data.battery);
  document.getElementById("batteryFill").setAttribute("width", String(16.8*pct/100));

  const thread=document.getElementById("thread");
  thread.innerHTML=data.messages.length
    ? data.messages.map(messageHTML).join("")
    : `<div class="thread-date">iMessage</div>`;

  const draft=document.getElementById("draftEn");
  draft.innerHTML=`${esc(data.draftEn)}<span class="cursor"></span>`;
  document.getElementById("draftKr").textContent=data.draftKr||"";
}

const data=parseData();
if(data){
  render(data);
}else{
  render({
    owner:"--",
    time:"--:--",
    battery:"75",
    contact:"Contact",
    messages:[],
    draftEn:"",
    draftKr:""
  });
}
</script>

</body>
</html>
